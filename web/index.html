<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par la valeur de --base-href lors de "flutter build web" -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UGS Commandes : passez et suivez vos commandes">
  <meta name="theme-color" content="#0D47A1">

  <!-- Installation sur écran d'accueil (Android / iOS) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UGS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UGS Commandes</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #1565C0; }
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; font-family: system-ui, sans-serif;
    }
    #chargement img { width: 96px; height: 96px; border-radius: 22px; }
    #chargement p { margin-top: 16px; font-size: 15px; opacity: .85; }
  </style>
</head>
<body>
  <!-- Écran affiché pendant le chargement de l'app (retiré au premier affichage Flutter) -->
  <div id="chargement">
    <img src="icons/Icon-192.png" alt="UGS">
    <p>Chargement…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('chargement');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
